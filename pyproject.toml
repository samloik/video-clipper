[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-clipper"
version = "0.1.0"
description = "Cut video fragments by timecodes from YouTube/TikTok URLs or local files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
video-clipper = "video_clipper.cli:main"
video-clipper-gui = "video_clipper.gui:main"
video-clipper-bot = "video_clipper.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
